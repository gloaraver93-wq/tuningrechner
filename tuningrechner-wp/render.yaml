services:
  - type: web
    name: tuningrechner
    runtime: node
    plan: starter
    buildCommand: "echo ok"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: daten
      mountPath: /var/data
      sizeGB: 1
